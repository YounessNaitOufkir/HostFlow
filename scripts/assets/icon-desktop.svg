<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Desktop/taskbar icon: unlike public/icon.svg (full-bleed, for the OS's own
       maskable crop on phones), this one draws its own rounding and a light-from-
       top gradient, because Windows and Chromium desktops render a PWA's 'any'
       icon exactly as given with no crop of their own. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4180"/>
      <stop offset="1" stop-color="#16244C"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
  <g transform="translate(256 256) scale(1.16) translate(-256 -256)">
    <rect x="104" y="130" width="184" height="68" rx="34" fill="#FFFFFF"/>
    <rect x="160" y="222" width="256" height="68" rx="34" fill="#F5A623"/>
    <rect x="224" y="314" width="160" height="68" rx="34" fill="#FFFFFF"/>
  </g>
</svg>
