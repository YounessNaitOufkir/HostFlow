<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Full-bleed ground on purpose: this icon is declared maskable, and the OS applies
       its own rounding. A rounded rect here would be double-rounded. The bars stay
       inside the 80% safe circle so a mask only ever trims navy. -->
  <rect width="512" height="512" fill="#1A2C5B"/>
  <rect x="104" y="130" width="184" height="68" rx="34" fill="#FFFFFF"/>
  <rect x="160" y="222" width="256" height="68" rx="34" fill="#F5A623"/>
  <rect x="224" y="314" width="160" height="68" rx="34" fill="#FFFFFF"/>
</svg>
