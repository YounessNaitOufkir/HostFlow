<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Phone home-screen icon (manifest purpose "maskable"). Android launchers show
       only about the central 68% of a maskable icon (measured on a real device:
       roughly x/y 82–430 of 512), so the mark from public/icon.svg would fill ~90%
       of the visible tile and crowd its edges. Here it is scaled to 0.76 around its
       own centre, leaving ~16% of navy on each side of the visible tile. The ground
       stays full-bleed (the OS does the rounding) and carries the same light-from-
       top gradient as scripts/assets/icon-desktop.svg. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4180"/>
      <stop offset="1" stop-color="#16244C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <g transform="translate(256 256) scale(0.76) translate(-260 -256)">
    <rect x="104" y="130" width="184" height="68" rx="34" fill="#FFFFFF"/>
    <rect x="160" y="222" width="256" height="68" rx="34" fill="#F5A623"/>
    <rect x="224" y="314" width="160" height="68" rx="34" fill="#FFFFFF"/>
  </g>
</svg>
